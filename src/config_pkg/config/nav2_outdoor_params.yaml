bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # The simulator publishes the vehicle's measured twist on this topic.
    # Leaving the Nav2 default (`odom`) selected creates a subscription with no
    # publisher, so RPP receives no current-velocity feedback even though pose
    # tracking continues through the CARLA odom -> base_link transform.
    odom_topic: /vehicle/odometry
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 1.0
      # GPS waypoints specify a place, not a required parking orientation.
      # Accept the final position from any heading so a forward-only vehicle
      # is not asked to make a large Dubins loop after entering the goal area.
      yaw_goal_tolerance: 3.14159
    FollowPath:
      # Smac Hybrid owns obstacle-aware path generation. Follow that path
      # deterministically instead of resampling a different MPPI trajectory
      # every 0.1 s; the latter produced 39 strong left/right sign changes in
      # one 2026-08-18 run and repeatedly inserted near-zero steering.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Normal straight-line target: 6 km/h (1.666... m/s).
      # Keep the normal route-following target near 4 km/h. Curvature/cost
      # regulation and the independent safety gate can reduce it further.
      desired_linear_vel: 1.0
      # A fixed 3.5 m carrot lets the full-size Lincoln begin an Ackermann
      # corner before reaching a close intermediate waypoint.
      lookahead_dist: 3.5
      use_velocity_scaled_lookahead_dist: false
      min_lookahead_dist: 2.5
      max_lookahead_dist: 4.5
      lookahead_time: 3.0
      transform_tolerance: 0.3
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 4.1
      regulated_linear_scaling_min_speed: 0.35
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.0
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      # A road car cannot rotate in place or reverse through a Dubins path.
      use_rotate_to_heading: false
      allow_reversing: false
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.20
      transform_tolerance: 0.3
      footprint: "[[2.4, 1.0], [2.4, -1.0], [-2.5, -1.0], [-2.5, 1.0]]"
      footprint_padding: 0.35
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Remove stale marked cells underneath the current footprint. Genuine
        # surrounding obstacles remain in the layer and the raw-LiDAR safety
        # node can still stop the vehicle independently.
        footprint_clearing_enabled: true
        # Points are filtered in the LiDAR frame before this layer, but after
        # TF conversion their Z is the absolute odom altitude (about 78 m in
        # Mine_01).  The Nav2 default 2 m ceiling would discard every point.
        min_obstacle_height: -1000.0
        max_obstacle_height: 1000.0
        observation_sources: obstacle_cloud clearing_cloud
        obstacle_cloud:
          topic: /lidar/nav2_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          obstacle_min_range: 1.5
          obstacle_max_range: 35.0
          raytrace_min_range: 1.5
          raytrace_max_range: 40.0
        clearing_cloud:
          topic: /lidar/nav2_clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          obstacle_min_range: 1.5
          obstacle_max_range: 35.0
          raytrace_min_range: 1.5
          raytrace_max_range: 40.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # The 1.35 m hard half-width is footprint (1.0) + padding (0.35).
        # Inflation out to 2.5 m adds a separate *preferred* clearance field;
        # it raises cost near walls without declaring that whole band lethal.
        inflation_radius: 2.5
        cost_scaling_factor: 1.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 100
      height: 100
      resolution: 0.25
      track_unknown_space: false
      transform_tolerance: 0.3
      footprint: "[[2.4, 1.0], [2.4, -1.0], [-2.5, -1.0], [-2.5, 1.0]]"
      # Keep one consistent *hard* collision envelope in global planning,
      # local control, and safety.  A larger global-only hard envelope can
      # leave the vehicle in a pose that local control safely reached but from
      # which the next global plan is impossible to start.  The inflation
      # layer below remains the soft preference for wider wall clearance.
      footprint_padding: 0.35
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        # Keep the layer-level gate wider than every CARLA map altitude. The
        # sensor-relative ground/sky band is already enforced by the filter.
        min_obstacle_height: -1000.0
        max_obstacle_height: 1000.0
        observation_sources: obstacle_cloud clearing_cloud
        obstacle_cloud:
          topic: /lidar/nav2_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          obstacle_min_range: 1.5
          obstacle_max_range: 45.0
          raytrace_min_range: 1.5
          raytrace_max_range: 50.0
          # CARLA sensor/TF stamps use simulation elapsed time while these
          # Nav2 nodes use wall time. A positive persistence window therefore
          # purges every scan as ancient. Zero means use the latest scan.
          observation_persistence: 0.0
        clearing_cloud:
          topic: /lidar/nav2_clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -1000.0
          max_obstacle_height: 1000.0
          obstacle_min_range: 1.5
          obstacle_max_range: 45.0
          raytrace_min_range: 1.5
          raytrace_max_range: 50.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # This is the preferred clearance field outside the shared 0.35 m hard
        # envelope.  Smac's cost multiplier favors it without making the whole
        # 2.5 m band an absolute no-go region.
        inflation_radius: 2.5
        cost_scaling_factor: 1.5
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    # F9/F10 execute one NavigateToPose segment at a time with GridBased Smac
    # Hybrid. This preserves the 4.1 m forward-only Ackermann turning radius
    # without constraining several manual GNSS poses in one Hybrid search.
    # PositionGrid remains only as a diagnostic/global-guide alternative.
    planner_plugins: [GridBased, PositionGrid]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 1.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 15.0
      minimum_turning_radius: 4.1
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      # Make the Smac search prefer the wider side of an obstacle instead of
      # accepting a geometrically legal path tight against its corner.
      cost_penalty: 3.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      debug_visualizations: false
      smooth_path: true
    PositionGrid:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 1.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      # Prefer paths with body clearance while allowing the same obstacle
      # costmap to decide which side of a building is traversable.
      cost_travel_multiplier: 3.0
      # A manual GNSS waypoint has no parking orientation. Derive its heading
      # from the computed path instead of honoring PoseStamped.orientation.
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [backup, wait]
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.75
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # Publish twice per controller update so CARLA receives a continuous steering
    # transition instead of a 10 Hz staircase.
    smoothing_frequency: 20.0
    # Ackermann curvature is angular.z / linear.x. Scale both components
    # together whenever a limit is hit so smoothing cannot distort the path.
    scale_velocities: true
    # CARLA's low-speed PID does not move at the first 0.075 m/s ramp step.
    # CLOSED_LOOP therefore restarted from measured zero on every cycle and
    # could never ramp high enough to launch the vehicle. Accumulate the
    # bounded command ramp internally, while odometry remains available to
    # The path controller itself still uses odometry for closed-loop tracking.
    feedback: OPEN_LOOP
    # Match the RPP normal route-following target near 4 km/h.
    max_velocity: [1.0, 0.0, 0.75]
    min_velocity: [0.0, 0.0, -0.75]
    max_accel: [1.5, 0.0, 0.4]
    max_decel: [-2.0, 0.0, -0.4]
    odom_topic: /vehicle/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
