arduino_vehicle_interface_node:
  ros__parameters:
    # This node must consume only the final command after the LiDAR safety gate.
    input_command_topic: /cmd_vel
    debug_command_topic: /vehicle/arduino_command
    serial_port: /dev/ttyACM0
    baud_rate: 115200
    serial_timeout_s: 0.1
    dry_run: false
    # Measured 1/5-scale terrain vehicle geometry.  The steering angle remains
    # an initial visual estimate and must be replaced after a turning-circle
    # or wheel-angle calibration.
    wheelbase_m: 0.80
    maximum_steering_angle_deg: 20.0
    # Serial steering calibration for dynamic_obstacle_ws driving.ino.
    # Positive ROS yaw is physical left, while that firmware represents full
    # left/centre/right as -7/0/+7.  These three values may be changed later
    # without changing or rebuilding the ROS node.
    maximum_steering_step: 7
    steering_left_command: -7
    steering_center_command: 0
    steering_right_command: 7
    # Current navigation limit is about 4 km/h. PWM 100 follows the existing
    # educational vehicle code but needs a real no-load/loaded speed test.
    maximum_speed_mps: 1.0
    maximum_pwm: 100
    steering_direction: 1.0
    motor_direction: 1.0
    terminal_log_period_s: 1.0
lane_info_extractor_node:
  ros__parameters:
    initial_lane: lane2
    select_driving_mode: normal
    select_lane_mode: lane_keeping
    select_task_mode: both
    src_mat:
    - 258
    - 301
    - 371
    - 301
    - 489
    - 479
    - 130
    - 479
lidar_processor_node:
  ros__parameters:
    flip_pivot_angle: 0
    flip_scan: false
    rotation_offset: 0
gnss_goal_manager_node:
  ros__parameters:
    # AKN-940-LTE receiver using the AKA900 antenna.  VN-200 contributes IMU
    # data only; keeping GNSS outside the /vectornav namespace prevents an
    # accidental switch back to its internal GNSS/INS output.
    gnss_topic: /gnss/fix
    odometry_topic: /vehicle/odometry
    goal_topic: /navigation/goal_gnss
    frame_id: map
    # Production-safe default. CARLA launches must explicitly request
    # carla_mercator so simulator geodesy cannot leak into the real vehicle.
    projection_mode: wgs84
    goal_enabled: false
    goal_latitude: 0.0
    goal_longitude: 0.0
    goal_altitude: 0.0
    use_odometry_position: true
    odometry_is_enu_aligned: true
    maximum_odometry_step_m: 10.0
    arrival_radius_m: 3.0
    leave_radius_m: 4.5
    arrival_consecutive_samples: 5
    direct_path_spacing_m: 1.0
    publish_rate_hz: 5.0
    sensor_timeout_s: 1.0
    # CARLA and real GNSS fixes contain metre-scale instantaneous noise. Use
    # four seconds of 5 Hz stationary samples so one fix cannot translate the
    # complete saved waypoint route between otherwise identical runs.
    origin_initialization_sample_count: 20
    terminal_log_period_s: 2.0
    log_navigation: true
    log_directory: ~/terrain_nav_data/logs/navigation
gnss_waypoint_manager_node:
  ros__parameters:
    route_topic: /navigation/waypoint_route
    goal_topic: /navigation/goal_gnss
    # Unit ENU tangent for the current WP. FAR uses it as terminal yaw so an
    # intermediate WP is crossed facing the following route leg.
    goal_tangent_topic: /navigation/goal_tangent
    goal_reached_topic: /navigation/goal_reached
    nav2_status_topic: /navigation/nav2_status
    require_nav2_success_for_final_completion: false
    # Nav2 feedback/geometric passage remains primary, but a waypoint that is
    # inside the debounced 3 m GNSS arrival radius must not stay latched as the
    # active mission goal. This fallback updates mission/UI progress without
    # replacing the active NavigateThroughPoses action.
    use_gnss_arrival_for_rolling_progress: true
    status_topic: /navigation/route_status
    index_topic: /navigation/route_index
    size_topic: /navigation/route_size
navigation_learning_recorder_node:
  ros__parameters:
    # Subscriber-only: this node never publishes a steering or speed command.
    # A new session starts automatically at F9/F10 `navigating` and closes at
    # completion, failure, cancellation, or node shutdown.
    enabled: true
    output_directory: ~/terrain_nav_data/learning/raw
    record_rate_hz: 5.0
    record_only_when_route_active: true
    maximum_cloud_age_s: 0.7
    maximum_odometry_age_s: 0.7
    writer_queue_size: 64
    # Paper evaluation keeps only lightweight CSV/JSON. Set both true again
    # only when collecting BEV tensors for future imitation learning.
    save_sample_files: false
    save_raw_points: false
    # Training-only CARLA supervision. The deployed model never subscribes to
    # this topic. Enable through collect_traversability_data:=true.
    save_semantic_labels: false
    maximum_semantic_alignment_s: 0.03
    # Optional vehicle-policy label for one controlled CARLA actor.  Keep the
    # ID at -1 for ordinary recording.  A non-negative ID requires semantic
    # collection and disposition=obstacle|passable|ambiguous.
    controlled_traversability_actor_id: -1
    controlled_traversability_disposition: ''
    controlled_traversability_blueprint: ''
    controlled_traversability_policy_source: vehicle_clearance_policy
    maximum_imu_age_s: 0.2
    # A separate, stationary raw-LiDAR capture for perception validation.
    # The launch argument `perception_capture:=true` overrides the two save
    # flags above, waits for fresh sensors, records for the chosen duration,
    # and writes outside the frozen mission-evaluation directory.
    perception_capture_on_start: false
    perception_capture_duration_s: 15.0
    perception_capture_output_directory: ~/terrain_nav_data/perception_validation/raw
    perception_capture_label: ''
    # Vehicle-centric BEV: x forward, y left. Row 0 is the far-forward edge.
    bev_x_min_m: -10.0
    bev_x_max_m: 30.0
    bev_y_min_m: -20.0
    bev_y_max_m: 20.0
    bev_z_min_m: -2.0
    bev_z_max_m: 3.0
    bev_resolution_m: 0.25
    point_cloud_topic: /lidar/points
    semantic_cloud_topic: /lidar/semantic_points
    imu_topic: /vectornav/imu
    odometry_topic: /vehicle/odometry
    route_topic: /navigation/waypoint_route
    route_status_topic: /navigation/route_status
    route_index_topic: /navigation/route_index
    route_size_topic: /navigation/route_size
    goal_local_topic: /navigation/goal_local
    current_local_topic: /navigation/current_local
    goal_vector_topic: /navigation/goal_vector
    far_subgoal_topic: /navigation/far_subgoal
    far_guide_path_topic: /navigation/far_guide_path
    nav2_plan_topic: /plan
    local_costmap_topic: /local_costmap/costmap
    global_costmap_topic: /global_costmap/costmap
    nav2_command_topic: /cmd_vel_nav2
    output_command_topic: /cmd_vel
    safety_state_topic: /safety/state
    safety_obstacle_points_topic: /safety/obstacle_points
    path_hard_valid_topic: /navigation/path_clearance/hard_valid
    path_clearance_status_topic: /navigation/path_clearance/status
    nav2_status_topic: /navigation/nav2_status
    far_guide_status_topic: /navigation/far_guide_status
    collision_topic: /vehicle/collision
nav2_goal_bridge_node:
  ros__parameters:
    goal_local_topic: /navigation/goal_local
    goal_vector_topic: /navigation/goal_vector
    odometry_topic: /vehicle/odometry
    status_topic: /navigation/nav2_status
    goal_pose_odom_topic: /navigation/nav2_goal
    action_name: /navigate_to_pose
    odom_frame: odom
    goal_change_tolerance_m: 0.25
    input_timeout_s: 1.0
    # A failed required Hybrid replan stops the controller, but it must not
    # erase the F9/F10 mission. Reissue the same rolling segment after a short
    # stationary backoff; a canceled waypoint handoff is never retried here.
    rolling_segment_abort_retry_s: 1.0
    # F9 open routes and F10 closed laps plan only the current and next
    # waypoint so the mapless local costmap need not cover the full route.
    rolling_horizon_window_size: 2
    # The global costmap is 100 x 100 m (roughly +/-50 m around the vehicle).
    # Keep a 5 m boundary margin: if the preview waypoint is farther away,
    # send only the current waypoint and add the preview as the car approaches.
    rolling_horizon_max_distance_m: 45.0
    # Rolling F9/F10 routes keep a precise 1 m circular arrival region. If Ackermann corner
    # cutting misses that circle, accept only a correctly directed crossing
    # of the waypoint gate within a separate, vehicle-scale lateral corridor.
    rolling_waypoint_capture_radius_m: 1.0
    # A full-size Ackermann vehicle naturally cuts a corner slightly while
    # following the outgoing preview. Keep straight WPs at 1.0 m, but permit
    # only real (>15 deg) corners to pass within 1.35 m.
    rolling_corner_capture_radius_m: 1.35
    rolling_waypoint_crossing_lateral_limit_m: 1.0
    rolling_waypoint_crossing_arm_m: 1.0
    # Keep the 3.5 m RPP lookahead for smooth long-range driving. Near a
    # nearly-straight WP this focus distance can still make it a true endpoint,
    # but a real corner keeps its successor so Ackermann steering sees the
    # outgoing tangent before reaching the WP.
    rolling_waypoint_focus_distance_m: 6.0
    rolling_waypoint_focus_max_turn_deg: 15.0
    # If the real successor is outside the 45 m rolling costmap horizon, add
    # only a bounded direction preview after the current WP. It is not counted
    # as a mission waypoint and is replaced by the real target at handoff.
    rolling_virtual_preview_distance_m: 10.0
    rolling_virtual_preview_boundary_margin_m: 2.0
    rolling_virtual_preview_min_distance_m: 2.0
    # The launch file injects the Ackermann Smac Hybrid behavior tree used by
    # rolling F9/F10 routes. Waypoint poses receive approach-direction yaw in
    # nav2_goal_bridge_node, while Nav2's goal checker remains position-only.
    rolling_behavior_tree: ''
    log_directory: ~/terrain_nav_data/logs/nav2_bridge
far_nav2_guide_node:
  ros__parameters:
    # FAR-inspired phase 1: search the currently observed rolling costmap for
    # a long collision-free guide, reduce it to line-of-sight vertices, and
    # ask Smac Hybrid to solve only the next short Ackermann segment.
    costmap_topic: /global_costmap/costmap
    goal_local_topic: /navigation/goal_local
    goal_tangent_topic: /navigation/goal_tangent
    current_local_topic: /navigation/current_local
    odometry_topic: /vehicle/odometry
    goal_reached_topic: /navigation/goal_reached
    action_name: /navigate_to_pose
    odom_frame: odom
    behavior_tree: ''
    planning_rate_hz: 2.0
    input_timeout_s: 1.5
    segment_lookahead_m: 12.0
    final_goal_distance_m: 10.0
    # The next-leg tangent is only a soft arrival preference.  Smac Hybrid's
    # pose yaw is otherwise exact, and a sharp tangent mismatch makes the
    # forward-only Dubins model generate a nearly 360-degree loop at the WP.
    goal_tangent_max_bias_deg: 20.0
    goal_change_tolerance_m: 0.25
    goal_hold_after_success_s: 1.5
    retry_delay_s: 1.0
    # A failed short Smac action often has two similar left/right retries in
    # the rolling grid. Retain the failed guide tangent as an 8 m, 12 s soft
    # cost preference. It prevents arbitrary opposite P-turns but never marks
    # the other side lethal, so a genuinely blocked corridor remains escapable.
    retry_direction_continuity_enabled: true
    retry_direction_hold_s: 12.0
    retry_direction_distance_m: 8.0
    retry_direction_cost_weight: 0.8
    # 정상 완료한 12 m 세그먼트의 진행 방향을 현재 mission WP가 끝날
    # 때까지 이어받는다. rolling costmap의 몇 개 셀 차이만으로 다음
    # 세그먼트가 반대 통로/P-turn으로 뒤집히는 현상을 억제한다.
    # hard block이 아닌 soft cost이므로 기존 통로가 실제로 막히면 A*는
    # 반대 통로를 선택할 수 있다. 실패 직후에는 위 retry 설정이 우선한다.
    leg_direction_continuity_enabled: true
    leg_direction_distance_m: 12.0
    leg_direction_cost_weight: 2.0
    # RPP가 충돌 예측으로 ABORT한 실제 12 m 행동 구간을 FAR에 되먹임한다.
    # 먼저 1.5 m 폭의 비용으로 다른 통로를 선호하게 하고, 동일 경로가
    # 다시 나오면 중심 0.75 m를 임시 차단해 다른 homotopy를 강제한다.
    # 대안이 없으면 같은 NavigateToPose를 반복하지 않고 5초간 정지한다.
    failed_corridor_enabled: true
    failed_corridor_hold_s: 20.0
    failed_corridor_radius_m: 1.5
    failed_corridor_cost_weight: 12.0
    failed_corridor_hard_radius_m: 0.75
    failed_corridor_similarity_m: 0.75
    failed_corridor_max_count: 4
    blocked_retry_s: 5.0
    # Keep evaluating fresh rolling-costmap guides while a 12 m Hybrid action
    # is active.  The paper/proposed default is sticky: a still-hard-valid
    # segment keeps control even if a shorter rolling guide appears.  Replace
    # it only after a persistent hard path conflict or after Nav2 reports the
    # action failed.  The old shorter-guide optimization remains switchable
    # for the paper ablation, but enabling it can create left/right action
    # cancellation chatter as the rolling map changes.
    active_replanning_enabled: true
    active_replan_allow_valid_path_optimization: false
    active_replan_min_interval_s: 2.0
    active_replan_confirmations: 3
    active_replan_subgoal_change_m: 3.0
    active_replan_min_improvement_m: 3.0
    active_replan_endpoint_tolerance_m: 2.0
    active_replan_consistency_m: 1.5
    path_hard_valid_topic: /navigation/path_clearance/hard_valid
    path_validity_timeout_s: 1.5
    # Reject only clearly wasteful Smac Hybrid paths.  The FAR prefix already
    # includes the obstacle detour, so a Hybrid path >1.9x longer, winding
    # >360 deg, or completing a >220 deg net loop is a kinematic artefact.
    # On the first rejection the same spatial corridor is retried with a
    # line-of-sight terminal yaw; only a repeated failure penalizes it.
    nav2_plan_topic: /plan
    path_efficiency_enabled: true
    path_efficiency_max_length_ratio: 1.9
    path_efficiency_max_abs_turn_deg: 360.0
    path_efficiency_max_signed_turn_deg: 220.0
    path_efficiency_min_reference_m: 4.0
    path_efficiency_min_excess_m: 4.0
    path_efficiency_endpoint_tolerance_m: 2.0
    path_efficiency_start_tolerance_m: 3.0
    path_efficiency_retry_yaw_hold_s: 15.0
    # Length alone is a soft efficiency signal. After one rejected topology
    # loop, accept a path whose only violation is length_ratio; signed loops
    # and excessive winding remain hard rejects. Collision safety is still
    # enforced by Nav2 costmaps, path clearance, and emergency stop.
    path_efficiency_allow_length_only_detour: true
    path_efficiency_length_only_detour_after_retries: 1
    # A rejected 12 m Dubins loop must change the planning problem, not just
    # resend the same pose. Shorten successive targets down to 5 m. After six
    # failures, hold for five seconds and issue a farther pose whose terminal
    # yaw is bounded from the current Ackermann heading. A close 5 m probe was
    # observed to reproduce the same full Dubins loop indefinitely.
    path_efficiency_max_retries: 6
    path_efficiency_retry_min_lookahead_m: 5.0
    path_efficiency_retry_lookahead_step_m: 1.5
    path_efficiency_blocked_retry_s: 5.0
    path_efficiency_escape_lookahead_m: 12.0
    path_efficiency_escape_max_yaw_change_deg: 35.0
    # If all six normal forward-only retries produce the same topology, allow
    # one bounded P-turn for this waypoint. This addresses the second failed
    # evaluation run without reopening unlimited circles: a >350 deg path,
    # >3.1x detour, or a second P-turn remains rejected.
    path_efficiency_allow_bounded_topology_escape: true
    path_efficiency_topology_escape_after_retries: 6
    path_efficiency_topology_escape_max_length_ratio: 3.1
    path_efficiency_topology_escape_max_abs_turn_deg: 350.0
    path_efficiency_topology_escape_max_signed_turn_deg: 330.0
    # After two controller aborts, clear only the rolling-map neighborhood
    # around a stationary vehicle, and only when both the independent path
    # gate and raw-LiDAR emergency state are fresh and clear.
    stuck_costmap_recovery_enabled: true
    stuck_costmap_recovery_abort_count: 2
    stuck_costmap_recovery_reset_distance_m: 3.0
    stuck_costmap_recovery_max_speed_mps: 0.1
    stuck_costmap_recovery_cooldown_s: 10.0
    safety_state_topic: /safety/state
    safety_state_timeout_s: 1.5
    # Raw-LiDAR safety already stops an unsafe commanded arc immediately.
    # Feed three distinct rejected scans back to FAR so it replaces that
    # guide instead of waiting 15 s for Nav2's progress checker. This never
    # clears an obstacle or overrides the emergency-stop command.
    safety_trajectory_rejection_topic: /safety/trajectory_rejection
    safety_rejection_replanning_enabled: true
    safety_rejection_confirmations: 3
    safety_rejection_window_s: 1.0
    safety_rejection_minimum_goal_age_s: 0.5
    # Only a fresh obstacle_stop can trigger cancellation. After cancellation,
    # wait for three consecutive clear states, but never longer than one
    # second, before asking Nav2 for a replacement segment. The independent
    # raw-LiDAR safety command remains authoritative throughout this hold.
    safety_replan_clear_confirmations: 3
    safety_replan_maximum_hold_s: 1.0
    local_costmap_clear_service: /local_costmap/clear_around_local_costmap
    global_costmap_clear_service: /global_costmap/clear_around_global_costmap
    # The Nav2 map is 0.25 m/cell. A stride of 2 gives a 0.5 m guide grid,
    # which is inexpensive but still finer than the full-size vehicle.
    grid_stride: 2
    # OccupancyGrid uses 100 for truly lethal obstacles and 99 for the
    # inscribed collision band. Ordinary FAR guide segments must not cross
    # either one; otherwise line-of-sight pruning can draw a straight segment
    # through an obstacle band even when its vertices lie in free cells.
    lethal_cost_threshold: 99.0
    # Unknown cells are traversable in mapless mode, but observed free cells
    # receive preference. Smac Hybrid and the safety nodes remain authoritative.
    unknown_cost: 0.15
    cost_weight: 4.0
    boundary_margin_m: 3.0
    # Max-pooling the 0.25 m Nav2 grid into 0.5 m FAR cells can form a false
    # 99-cost ring around a valid current pose. Release only non-lethal (<100)
    # cells within 2 m of the start, retaining their high cost. Actual cost-100
    # obstacles are never cleared and cost-99 remains hard outside this disk.
    start_clearance_m: 2.0
    goal_search_radius_m: 4.0
    maximum_expansions: 120000
    log_directory: ~/terrain_nav_data/logs/far_guide
lidar_obstacle_filter_node:
  ros__parameters:
    input_topic: /lidar/points
    # The authority node relays this private baseline to the established
    # /lidar/nav2_obstacles interface. It can add evidence-v2 endpoints but
    # can never remove a baseline point.
    output_topic: /lidar/nav2_obstacles_baseline
    point_count_topic: /lidar/nav2_obstacle_count
    # The sensor is on the roof. Ground lies below this band, while vehicle,
    # pole, container and wall returns remain in it.
    minimum_z_m: -1.4
    maximum_z_m: 1.0
    minimum_range_m: 1.5
    maximum_range_m: 45.0
    voxel_size_m: 0.20
    # Remove roof/hood/rear returns from the Nav2-only cloud. Safety retains
    # the original raw cloud, so this does not weaken emergency stopping.
    remove_ego_body_points: true
    ego_front_m: 2.55
    ego_rear_m: 2.65
    ego_half_width_m: 1.15
    # The legacy z >= -1.4 crop removes Town curbs together with the road.
    # Fit the local road plane and retain surfaces 7--45 cm above it so Nav2
    # sees curbs/sidewalks without turning the road itself into an obstacle.
    ground_relative_low_obstacles_enabled: true
    ground_fit_minimum_range_m: 2.0
    ground_fit_maximum_range_m: 20.0
    ground_fit_minimum_z_m: -2.5
    ground_fit_maximum_z_m: -0.8
    ground_seed_quantile: 0.35
    ground_inlier_tolerance_m: 0.06
    minimum_ground_points: 80
    low_obstacle_minimum_height_m: 0.07
    low_obstacle_maximum_height_m: 0.45
    # Follow the local road surface instead of comparing the complete scan to
    # one plane. This prevents crowned/sloped intersections from becoming
    # phantom obstacles while retaining abrupt curb edges.
    local_ground_enabled: true
    local_ground_resolution_m: 0.75
    local_ground_radius_m: 1.50
    local_ground_quantile: 0.25
    # Fit local pitch/crown instead of treating every neighbourhood as flat.
    local_ground_plane_enabled: true
    local_ground_plane_residual_tolerance_m: 0.055
    # Sparse full-scan rays clear transient obstacle marks immediately.  This
    # topic is clearing-only in both Nav2 costmaps and cannot mark obstacles.
    clearing_output_topic: /lidar/nav2_clearing
    clearing_voxel_size_m: 0.50
traversability_evidence_shadow_node:
  ros__parameters:
    input_topic: /lidar/points
    passable_probability_topic: /learning/evidence_v2/passable_probability
    obstacle_probability_topic: /learning/evidence_v2/obstacle_probability
    decision_topic: /learning/evidence_v2/decision
    hard_obstacle_topic: /learning/evidence_v2/hard_obstacle
    status_topic: /learning/evidence_v2/status
    maximum_inference_rate_hz: 5.0
    passable_probability_threshold: 0.90
    obstacle_probability_threshold: 0.50
    maximum_obstacle_probability_for_passable: 0.10
    minimum_passable_support: 0.20
    maximum_mc_variance: 0.02
    # These are the frozen CARLA Lincoln values used to build the training BEV.
    # Replace them with a separately measured 1/5-scale vehicle profile before
    # active real-platform tests; do not scale them by an assumed ratio.
    hard_obstacle_minimum_relative_height_m: 0.15
    hard_obstacle_minimum_vertical_span_m: 0.15
    hard_obstacle_minimum_absolute_height_m: -1.40
    local_ground_near_radius_m: 0.75
    local_ground_far_radius_m: 1.50
    local_ground_quantile: 0.25
    local_ground_minimum_support_cells: 4
    bev_x_min_m: -10.0
    bev_x_max_m: 30.0
    bev_y_min_m: -20.0
    bev_y_max_m: 20.0
    bev_resolution_m: 0.25
    bev_z_min_m: -2.0
    bev_z_max_m: 3.0
    ego_rear_m: 2.5
    ego_front_m: 2.4
    ego_half_width_m: 1.0
traversability_obstacle_authority_node:
  ros__parameters:
    raw_cloud_topic: /lidar/points
    baseline_cloud_topic: /lidar/nav2_obstacles_baseline
    decision_topic: /learning/evidence_v2/decision
    selected_cloud_topic: /lidar/nav2_obstacles
    candidate_cloud_topic: /learning/evidence_v2/nav2_obstacles_candidate
    added_cloud_topic: /learning/evidence_v2/added_obstacles
    status_topic: /learning/evidence_v2/authority_status
    cache_size: 32
    maximum_ai_silence_s: 0.50
    maximum_exact_match_delay_s: 0.50
    minimum_range_m: 1.5
    # Baseline obstacle sensing remains 45 m.  The learned model may append
    # new endpoints only in the validated near field, where LiDAR support is
    # dense enough for a reliable local-ground check.
    maximum_range_m: 12.0
    obstacle_maximum_z_m: 1.0
    # In an obstacle cell append only returns near its maximum height. This
    # prevents a road return sharing the cell with a small object from being
    # inserted as a ground-level obstacle endpoint.
    obstacle_cell_top_band_m: 0.05
    # A learned obstacle endpoint must also be physically raised above a
    # supported local road estimate.  Unsupported/surface-level cells retain
    # the baseline unchanged instead of creating a phantom Nav2 obstacle.
    addition_minimum_relative_height_m: 0.07
    addition_local_ground_radius_m: 0.75
    addition_local_ground_quantile: 0.25
    addition_local_ground_minimum_support_cells: 4
    voxel_size_m: 0.20
    ego_front_m: 2.55
    ego_rear_m: 2.65
    ego_half_width_m: 1.15
    bev_x_min_m: -10.0
    bev_x_max_m: 30.0
    bev_y_min_m: -20.0
    bev_y_max_m: 20.0
    bev_resolution_m: 0.25
    bev_z_min_m: -2.0
    bev_z_max_m: 3.0
path_clearance_validator_node:
  ros__parameters:
    path_topic: /plan
    cloud_topic: /lidar/nav2_obstacles
    base_frame: base_link
    hard_valid_topic: /navigation/path_clearance/hard_valid
    preferred_valid_topic: /navigation/path_clearance/preferred_valid
    minimum_clearance_topic: /navigation/path_clearance/minimum
    status_topic: /navigation/path_clearance/status
    marker_topic: /navigation/path_clearance/marker
    # Physical Lincoln body. Margins below are measured from this body, not
    # from the vehicle centre and not from an inflation-cell colour.
    vehicle_front_m: 2.4
    vehicle_rear_m: 2.5
    vehicle_half_width_m: 1.0
    # Hard matches Nav2 footprint_padding. Preferred is a measurable target:
    # 1.75 m centre-to-side-obstacle on a straight side passage.
    hard_clearance_m: 0.35
    preferred_clearance_m: 0.75
    path_sample_spacing_m: 0.25
    # Only imminent path conflicts may stop the vehicle. At 4 km/h an 8 m
    # horizon is roughly seven seconds of travel; farther Smac path portions
    # can be replanned before arrival. The independent 4 m LiDAR safety node
    # remains the final emergency-stop authority.
    validation_horizon_m: 8.0
    validation_rate_hz: 2.0
    # Evaluate the cloud and vehicle origin in one measurement-time TF snapshot.
    transform_timeout_s: 0.20
    log_directory: ~/terrain_nav_data/logs/path_clearance
path_validity_gate_node:
  ros__parameters:
    # RPP may keep publishing the last path command while Smac is unable to
    # replace an invalid plan. This gate makes the clearance result an actual
    # command authority instead of a diagnostic-only RViz colour.
    input_command_topic: /cmd_vel_nav2
    output_command_topic: /cmd_vel_path_validated
    hard_valid_topic: /navigation/path_clearance/hard_valid
    blocked_topic: /navigation/path_validity_gate/blocked
    status_topic: /navigation/path_validity_gate/status
    # The validator runs at 2 Hz. Require persistent invalid/valid samples so
    # one sparse LiDAR frame cannot stop or restart the vehicle.
    invalid_hold_s: 0.75
    valid_release_s: 0.75
    validity_timeout_s: 1.5
    control_rate_hz: 20.0
    log_directory: ~/terrain_nav_data/logs/path_validity_gate
gps_go_to_goal_controller_node:
  ros__parameters:
    goal_vector_topic: /navigation/goal_vector
    distance_topic: /navigation/distance_to_goal
    goal_reached_topic: /navigation/goal_reached
    status_topic: /navigation/status
    odometry_topic: /vehicle/odometry
    command_topic: /cmd_vel_navigation
    route_topic: /navigation/waypoint_route
    route_status_topic: /navigation/route_status
    route_index_topic: /navigation/route_index
    origin_topic: /navigation/origin_gnss
    current_local_topic: /navigation/current_local
    smoothed_path_topic: /navigation/smoothed_path
    # Build one continuous curve through the waypoint list, then use a
    # forward-only Pure Pursuit controller instead of aiming at each waypoint
    # as an independent straight-line goal.
    smooth_route_enabled: true
    route_path_spacing_m: 0.5
    route_tangent_scale: 0.5
    # Stay inside the GNSS goal manager's 3 m arrival radius while rounding a
    # corner, so every sequential waypoint still advances normally.
    route_maximum_waypoint_deviation_m: 2.0
    route_lookahead_distance_m: 5.0
    # A local search prevents a closed route from jumping straight from its
    # start to the nearby final point before completing the lap.  The absolute
    # progress budget below also limits advancement to actual driven distance,
    # so repeated control ticks cannot creep into a future path segment.
    route_nearest_search_ahead: 80
    route_progress_distance_ratio: 1.5
    route_progress_lead_m: 2.0
    publish_rate_hz: 10.0
    input_timeout_s: 1.0
    # 3.0 m/s = 10.8 km/h normal cruise. Start slowing earlier than the old
    # 5.4 km/h profile so the 3 m arrival radius remains reliable.
    maximum_speed_mps: 3.0
    minimum_speed_mps: 0.5
    slowdown_distance_m: 12.0
    stop_distance_m: 3.0
    heading_kp: 1.0
    maximum_yaw_rate_rps: 0.5
    minimum_heading_speed_ratio: 0.2
    wheelbase_m: 2.85
    maximum_steering_angle_deg: 35.0
    recovery_heading_threshold_deg: 75.0
    recovery_minimum_speed_mps: 0.8
    # Avoid a visually abrupt hook just outside the 3 m arrival radius.
    arrival_maximum_curvature_per_m: 0.10
    terminal_log_period_s: 2.0
local_avoidance_node:
  ros__parameters:
    input_cloud_topic: /lidar/points
    input_command_topic: /cmd_vel_navigation
    output_command_topic: /cmd_vel_avoidance
    odometry_topic: /vehicle/odometry
    goal_vector_topic: /navigation/goal_vector
    collision_topic: /vehicle/collision
    distance_to_goal_topic: /navigation/distance_to_goal
    safety_stop_topic: /safety/emergency_stop
    safety_trajectory_rejection_topic: /safety/trajectory_rejection
    state_topic: /avoidance/state
    selected_side_topic: /avoidance/selected_side
    path_topic: /avoidance/path
    center_points_topic: /avoidance/center_points
    left_points_topic: /avoidance/left_points
    right_points_topic: /avoidance/right_points
    actual_lateral_topic: /avoidance/actual_lateral_offset
    route_topic: /navigation/waypoint_route
    route_status_topic: /navigation/route_status
    route_index_topic: /navigation/route_index
    route_size_topic: /navigation/route_size
    smoothed_path_topic: /navigation/smoothed_path
    current_local_topic: /navigation/current_local
    avoidance_enabled: true
    publish_rate_hz: 10.0
    lidar_timeout_s: 1.0
    odometry_timeout_s: 0.6
    command_timeout_s: 0.6
    goal_distance_timeout_s: 1.0
    minimum_x_m: 2.5
    detection_distance_m: 17.0
    center_half_width_m: 1.35
    vehicle_width_m: 2.0
    # The previous 0.4 m buffer let the Lincoln's swept front/rear corner
    # touch a parked vehicle. Keep 0.65 m outside the measured body width.
    lateral_clearance_m: 0.65
    vehicle_front_m: 2.4
    vehicle_rear_m: 2.5
    minimum_z_m: -1.4
    maximum_z_m: 1.0
    minimum_obstacle_points: 20
    preferred_side: left
    # Cruise can remain at 10.8 km/h, while obstacle trajectories are capped
    # at 3.6 km/h. The legacy S-detour parameters remain available as rollback
    # settings when trajectory_planner_enabled is false.
    avoidance_speed_mps: 1.0
    avoidance_entry_speed_mps: 1.2
    deceleration_required_cycles: 3
    lateral_offset_m: 3.5
    entry_forward_m: 7.0
    return_forward_m: 7.0
    return_lateral_tolerance_m: 0.3
    # Return as soon as the tracked obstacle is behind the rear bumper; two
    # consecutive clear scans reject a one-frame LiDAR dropout.
    passage_rear_clearance_m: 0.0
    passage_minimum_lateral_m: 0.6
    passage_maximum_lateral_m: 7.0
    passage_clear_required_scans: 2
    target_initial_half_length_m: 0.75
    target_association_gap_m: 1.5
    target_maximum_forward_extent_m: 6.0
    path_sample_spacing_m: 0.75
    path_lookahead_m: 4.0
    waypoint_reached_radius_m: 0.8
    goal_stop_distance_m: 3.0
    goal_obstacle_margin_m: 0.5
    goal_approach_speed_limit_distance_m: 6.0
    lateral_reached_tolerance_m: 0.2
    lateral_reached_required_cycles: 3
    heading_kp: 1.0
    maximum_yaw_rate_rps: 0.35
    minimum_heading_speed_ratio: 0.25
    wheelbase_m: 2.85
    maximum_steering_angle_deg: 35.0
    # Receding-horizon Ackermann trajectory planner. Every LiDAR scan tests
    # 13 left/straight/right arcs against the full vehicle-width corridor.
    # A short obstacle naturally produces an S-like pass and return; an
    # extended wall keeps selecting a safe parallel arc until the direct GNSS
    # corridor is clear again.
    trajectory_planner_enabled: true
    trajectory_horizon_m: 10.0
    # Intermediate waypoints always retain the full 10 m horizon. At the
    # final goal it may shrink, but not below the safety node's 8 m clear
    # corridor, so local planning cannot miss an obstacle safety will stop for.
    trajectory_minimum_horizon_m: 8.0
    trajectory_sample_spacing_m: 0.35
    # Use the same nominal curved swept footprint as the final safety gate
    # for hard avoidance activation. The uncertainty envelope remains a
    # caution/diagnostic signal and cannot start a false detour by itself.
    navigation_trajectory_sample_spacing_m: 0.25
    navigation_trajectory_curvature_uncertainty_per_m: 0.04
    navigation_trajectory_extra_width_m: 0.25
    trajectory_candidate_count: 13
    trajectory_maximum_curvature_per_m: 0.18
    trajectory_proximity_margin_m: 0.8
    trajectory_voxel_size_m: 0.2
    # A collision path must contain no occupied 20 cm voxel. The old value 4
    # explicitly allowed up to three obstacle cells inside the swept body.
    trajectory_minimum_obstacle_cells: 1
    # Recheck every selected curve against the same raw-point resolution and
    # 8 m release corridor used by the final safety gate. A safety rejection
    # temporarily removes that curvature so the planner can try another arc.
    safety_validation_clear_distance_m: 8.0
    safety_validation_sample_spacing_m: 0.25
    safety_validation_minimum_obstacle_points: 20
    safety_rejection_hold_s: 1.5
    safety_rejection_curvature_tolerance_per_m: 0.012
    trajectory_clear_required_scans: 5
    # Do not bend back toward the GNSS line while the passed obstacle is still
    # visible on the inside of the detour.
    trajectory_side_lock_clear_required_scans: 5
    # A second obstacle encountered after a genuinely clear interval starts a
    # fresh direction commitment instead of inheriting the previous detour's
    # recovery curvature.
    new_obstacle_clear_required_scans: 5
    # Re-arm during recovery only after the vehicle is close to its saved
    # route. Otherwise a large looping detour can see the original obstacle
    # again and incorrectly call it a second obstacle.
    new_obstacle_recommit_max_lateral_m: 1.5
    # When both Ackermann arc families pass exact collision validation, use a
    # material difference in the broad side corridors to break the tie. This
    # prevents a fixed left preference from choosing 50 points over 0 points.
    trajectory_side_corridor_advantage_points: 20
    # Keep the committed turn long enough to produce a real lane-width shift,
    # then permit safe return curvature even if the old centre line is still
    # occupied. Never let one avoidance drift indefinitely away from its
    # saved route.
    trajectory_side_lock_minimum_lateral_m: 3.0
    trajectory_maximum_lateral_excursion_m: 5.0
    # Detect early and slow down, but do not select left/right until the
    # obstacle is close enough for both side corridors to be well observed.
    trajectory_commit_distance_m: 10.5
    # Do not hand control back merely because the goal-directed corridor is
    # empty. The vehicle must also return close to the pre-avoidance line and
    # point along it for five consecutive LiDAR scans.
    recovery_lateral_tolerance_m: 0.75
    recovery_heading_tolerance_deg: 8.0
    recovery_required_scans: 5
    # Recover toward a nearby point on the saved line rather than looking only
    # at a far-away GNSS goal. This removes long parallel-offset driving.
    recovery_lookahead_m: 8.0
    # Follow only nearby forward path segments after a detour. This prevents a
    # closed building loop from snapping back to an already passed segment.
    recovery_path_search_ahead: 80
    # The segment count remains a CPU guard. This metric limit prevents a
    # closed loop from snapping to a geometrically nearby path tens of metres
    # ahead after an avoidance manoeuvre.
    recovery_path_search_distance_m: 12.0
    recovery_speed_mps: 1.5
    # Ramp from the 1 m/s avoidance speed back to cruise speed instead of
    # applying a one-cycle 1 -> 3 m/s command jump.
    handoff_acceleration_mps2: 0.75
    handoff_minimum_duration_s: 1.0
    trajectory_goal_weight: 3.0
    trajectory_switch_weight: 1.0
    trajectory_curvature_weight: 0.15
    trajectory_proximity_weight: 1.0
    trajectory_opposite_goal_weight: 1.5
    maximum_avoidance_duration_s: 120.0
    terminal_log_period_s: 2.0
    log_avoidance: true
    log_directory: ~/terrain_nav_data/logs/avoidance
navigation_visualization_node:
  ros__parameters:
    odometry_topic: /vehicle/odometry
    current_local_topic: /navigation/current_local
    smoothed_path_topic: /navigation/smoothed_path
    smoothed_path_odom_topic: /navigation/smoothed_path_odom
    driven_path_topic: /navigation/driven_path
    vehicle_footprint_topic: /navigation/vehicle_footprint
    route_topic: /navigation/waypoint_route
    output_frame: odom
    # Unpadded physical Lincoln outline. The two Nav2 costmaps separately
    # publish their padded local-hard (+0.35 m) and global-plan (+1.0 m)
    # footprints for comparison in RViz.
    vehicle_front_m: 2.4
    vehicle_rear_m: 2.5
    vehicle_half_width_m: 1.0
    minimum_path_spacing_m: 0.15
    maximum_path_points: 5000
    maximum_odometry_step_m: 5.0
    publish_rate_hz: 5.0
lidar_emergency_stop_node:
  ros__parameters:
    input_cloud_topic: /lidar/points
    input_command_topic: /cmd_vel_avoidance
    raw_command_topic: /nav2/cmd_vel_raw
    output_command_topic: /cmd_vel
    emergency_stop_topic: /safety/emergency_stop
    nearest_obstacle_topic: /safety/nearest_obstacle_distance
    state_topic: /safety/state
    point_count_topic: /safety/obstacle_points
    trajectory_rejection_topic: /safety/trajectory_rejection
    # Diagnostic-only outputs. These show the exact raw returns and nominal
    # Ackermann arc used by the hard-stop decision; they do not alter control.
    trigger_points_topic: /safety/trigger_points
    checked_trajectory_topic: /safety/checked_trajectory
    collision_topic: /vehicle/collision
    collision_reset_topic: /safety/reset_collision
    route_topic: /navigation/waypoint_route
    publish_rate_hz: 20.0
    lidar_timeout_s: 1.0
    command_timeout_s: 0.6
    minimum_x_m: 2.5
    # At the current 1.0 m/s Nav2 limit, this checks roughly four seconds of
    # commanded travel.  Keep the release band 2 m longer to prevent rapid
    # stop/clear oscillation without blocking the path controller too early.
    stop_distance_m: 4.0
    clear_distance_m: 6.0
    # Match Nav2's 1.0 m half vehicle width + 0.35 m footprint padding.
    # The additional uncertainty envelope below remains caution-only.
    corridor_half_width_m: 1.35
    vehicle_front_m: 2.4
    vehicle_rear_m: 2.5
    vehicle_width_m: 2.0
    minimum_z_m: -1.4
    maximum_z_m: 1.0
    # Use the same road-relative curb extraction as the Nav2 obstacle cloud.
    # On the roof-mounted sensor the road is around z=-1.8 m, so a fixed
    # z >= -1.4 crop alone also deletes a 10--20 cm curb from safety checks.
    ground_relative_low_obstacles_enabled: true
    ground_fit_minimum_range_m: 2.0
    ground_fit_maximum_range_m: 20.0
    ground_fit_minimum_z_m: -2.5
    ground_fit_maximum_z_m: -0.8
    ground_seed_quantile: 0.35
    ground_inlier_tolerance_m: 0.06
    minimum_ground_points: 80
    low_obstacle_minimum_height_m: 0.07
    low_obstacle_maximum_height_m: 0.45
    local_ground_enabled: true
    local_ground_resolution_m: 0.75
    local_ground_radius_m: 1.50
    local_ground_quantile: 0.25
    local_ground_plane_enabled: true
    local_ground_plane_residual_tolerance_m: 0.055
    minimum_obstacle_points: 20
    clear_required_scans: 3
    # Check the swept corridor of the actual Ackermann steering command.
    # This lets a safe turning command move away from a wall while retaining
    # an independent emergency stop for obstacles on the selected curve.
    use_commanded_trajectory: true
    trajectory_sample_spacing_m: 0.25
    maximum_curvature_per_m: 0.25
    # CARLA steering follows a changed command with delay. Check a small fan
    # around both the previous and newly commanded Ackermann trajectories.
    trajectory_curvature_uncertainty_per_m: 0.04
    trajectory_safety_extra_width_m: 0.25
    # If only the uncertainty fan is occupied, keep steering along the local
    # planner's clear path at a cautious crawl instead of deadlocking.
    caution_speed_mps: 0.35
    # Reject an unsafe controller sample without centering the steering. Reuse the
    # most recent LiDAR-validated avoidance curve at low speed, rechecking it
    # against every scan. If that held curve becomes unsafe, stop completely.
    hold_last_safe_trajectory: true
    minimum_recovery_curvature_per_m: 0.06
    recovery_candidate_max_age_s: 1.0
    recovery_max_duration_s: 8.0
    recovery_curvature_smoothing_alpha: 0.35
    # A collision is a terminal safety event. F9/new route or an explicit
    # /safety/reset_collision=true command is required before motion resumes.
    collision_latch_enabled: true
    minimum_collision_intensity: 1.0
    reset_collision_on_new_route: true
    terminal_log_period_s: 2.0
    log_safety: true
    log_directory: ~/terrain_nav_data/logs/safety
terrain_mapping_node:
  ros__parameters:
    input_cloud_topic: /lidar/points
    map_points_topic: /terrain/map_points
    slope_costmap_topic: /terrain/slope_costmap
    traversability_costmap_topic: /terrain/traversability_costmap
    map_frame: odom
    voxel_size_m: 0.20
    rolling_radius_m: 40.0
    maximum_voxel_age_s: 0.0
    map_resolution_m: 0.25
    map_publish_rate_hz: 1.0
    minimum_range_m: 1.0
    maximum_range_m: 50.0
    ego_min_x_m: -2.8
    ego_max_x_m: 2.8
    ego_half_width_m: 1.25
    minimum_points_per_cell: 1
    safe_slope_deg: 8.0
    lethal_slope_deg: 25.0
    safe_step_height_m: 0.10
    lethal_step_height_m: 0.35
    pending_cloud_limit: 20
    terminal_log_period_s: 2.0
